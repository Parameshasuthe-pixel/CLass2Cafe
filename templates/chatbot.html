<!DOCTYPE html>
<html>
<head>
    <title>Class2Cafe Chatbot</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:30px;
        }

        #chatbox{
            background:white;
            height:400px;
            overflow-y:auto;
            padding:15px;
            border-radius:10px;
            margin-bottom:10px;
        }

        input{
            width:75%;
            padding:10px;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }

        .user{
            color:blue;
            margin:10px 0;
        }

        .bot{
            color:green;
            margin:10px 0;
        }
    </style>
</head>

<body>

    <h2>🤖 Class2Cafe Chatbot</h2>

    <div id="chatbox"></div>

    <input type="text" id="message" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

    <script>

        async function sendMessage(){

            let input = document.getElementById("message");
            let message = input.value;

            if(message.trim() === ""){
                return;
            }

            let chatbox = document.getElementById("chatbox");

            chatbox.innerHTML +=
                `<div class="user"><b>You:</b> ${message}</div>`;

            input.value = "";

            let response = await fetch("/chat",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:message
                })
            });

            let data = await response.json();

            chatbox.innerHTML +=
                `<div class="bot"><b>Bot:</b> ${data.response}</div>`;

            chatbox.scrollTop = chatbox.scrollHeight;
        }

    </script>

</body>
</html>
