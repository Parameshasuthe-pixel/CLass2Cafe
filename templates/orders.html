<!DOCTYPE html>
<html>
<head>
    <title>Orders Dashboard</title>
</head>
<body>

    <h1>Orders Dashboard</h1>

    <table border="1" cellpadding="10">

        <tr>
            <th>Order ID</th>
            <th>Customer ID</th>
            <th>Total Amount</th>
            <th>Payment Status</th>
            <th>Order Status</th>
            <th>Created At</th>
            <th>Action</th>
        </tr>

        {% for order in orders %}
        <tr>
            <td>{{ order.order_id }}</td>
            <td>{{ order.user_id }}</td>
            <td>₹{{ order.total_amount }}</td>
            <td>{{ order.payment_status }}</td>
            <td>{{ order.status }}</td>
            <td>{{ order.created_at }}</td>

            <td>
                <a href="/complete/{{ order.id }}">
                    Mark Completed
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
